<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>授权连接 Fast Spider</title>
  <link rel="stylesheet" href="{{.BasePath}}/assets/app.css">
</head>
<body class="auth-page">
  <main class="auth-card wide">
    <div class="brand-mark">FS</div>
    <p class="eyebrow">OAuth 授权</p>
    <h1>允许客户端连接？</h1>
    <p class="muted">你已登录为 <strong>{{.DisplayName}}</strong>。{{.Description}}</p>
    {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
    <section class="client-card">
      <span class="status-dot"></span>
      <div>
        <strong>{{.ClientName}}</strong>
        <p>{{.ScopeLabel}} · {{.ClientID}}</p>
      </div>
    </section>
    <form method="post" action="{{.BasePath}}/oauth/authorize">
      {{range .Fields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">{{end}}
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="button-row">
        <button class="primary" type="submit" name="decision" value="approve">允许连接</button>
        <button class="secondary" type="submit" name="decision" value="deny">取消</button>
      </div>
    </form>
    <p class="hint">授权记录会出现在后台列表中，可随时撤销。已签发的明文令牌不会在后台重复显示。</p>
  </main>
</body>
</html>
