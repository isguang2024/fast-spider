<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接令牌 · Fast Spider</title>
  <link rel="stylesheet" href="{{.BasePath}}/assets/app.css">
  <script src="{{.BasePath}}/assets/app.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card wide token-card">
    <div class="brand-mark">FS</div>
    <p class="eyebrow">Connection Token</p>
    <h1>连接令牌已创建</h1>
    <p class="muted">这是唯一一次显示明文令牌。把它填写到 Fast Spider Node 本地客户端界面即可；同一个有效令牌可以给当前账户下多台 Node 重复使用，不绑定某一台设备。Node 登记成功后不保存令牌，GPT 的 MCP 连接仍使用 OAuth。</p>
    <div class="one-time-banner" role="status">
      <strong>{{.Label}}</strong>
      <span>有效期：{{.Expires}}</span>
    </div>
    <label for="created-token">令牌</label>
    <div class="copy-field">
      <textarea id="created-token" rows="4" readonly spellcheck="false">{{.Token}}</textarea>
      <button class="secondary" type="button" data-copy-target="created-token">复制令牌</button>
    </div>
    <p class="hint">关闭此页面后无法再次查看明文。需要连接其他设备时可以继续复用你已安全保存的这个令牌；如果丢失或不再使用，请在后台撤销并重新创建。</p>
    <a class="primary button-link" href="{{.BasePath}}/app/access/tokens">返回连接令牌</a>
  </main>
</body>
</html>
